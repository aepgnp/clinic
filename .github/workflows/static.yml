<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診所看診進度</title>
    <style>
        /* --- 基礎設定 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 15px; /* 手機版留邊 */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 改為靠上對齊，避免內容太多被切掉 */
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        /* --- 頂部狀態區 --- */
        .header {
            background: linear-gradient(135deg, #0061ff 0%, #60efff 100%);
            color: white;
            padding: 25px 20px;
        }

        .clinic-name { font-size: 1.6rem; font-weight: bold; margin-bottom: 10px; }
        .status-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
        }

        /* --- 主要號碼顯示區 --- */
        .main-content { padding: 30px 20px 20px 20px; }
        .label { color: #8898aa; font-size: 1rem; margin-bottom: 5px; }
        
        .current-number {
            font-size: 7.5rem; /* 超大字體 */
            font-weight: 800;
            color: #32325d;
            line-height: 1;
            margin: 10px 0 30px 0;
        }

        /* --- 資訊網格 --- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
            margin-bottom: 20px;
        }
        .info-item h3 { margin: 0; font-size: 1.8rem; color: #32325d; }

        /* --- 🟡 新增：長輩友善計算機 🟡 --- */
        .calculator-section {
            background-color: #fff8e1; /* 溫暖的黃色底 */
            border: 2px solid #ffe082;
            border-radius: 15px;
            padding: 20px;
            margin: 0 20px 25px 20px; /* 這裡調整間距 */
        }
        
        .calc-title {
            font-size: 1.2rem;
            color: #ff6f00;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 100px;
            height: 50px;
            font-size: 1.8rem;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: none;
        }
        
        input[type="number"]:focus { border-color: #ff6f00; }

        .calc-result {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #5a5a5a;
            min-height: 1.5em;
        }

        .time-highlight {
            color: #d32f2f; /* 紅色強調時間 */
            font-size: 1.6rem;
        }

        /* --- 底部 --- */
        .footer {
            background: #fcfcfc;
            padding: 15px;
            font-size: 0.9rem;
            color: #adb5bd;
            border-top: 1px solid #f0f0f0;
        }

        /* 連線燈號 */
        .connection-status {
            position: absolute; top: 15px; right: 15px;
            width: 12px; height: 12px;
            border-radius: 50%; background-color: #ddd;
        }
        .status-ok { background-color: #2dce89; box-shadow: 0 0 8px #2dce89; }
        .status-err { background-color: #f5365c; }
    </style>
</head>
<body>

    <div class="card">
        <div class="connection-status" id="connStatus"></div>

        <div class="header">
            <div class="clinic-name" id="clinicName">載入中...</div>
            <div class="status-badge" id="status">---</div>
        </div>

        <div class="main-content">
            <div>
                <div class="label">目前叫號</div>
                <div class="current-number" id="currentNumber">--</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="label">等待人數</div>
                    <h3 id="waitingCount">--</h3>
                </div>
                <div class="info-item">
                    <div class="label">最後更新</div>
                    <h3 id="lastUpdate">--:--</h3>
                </div>
            </div>
        </div>

        <!-- 🟡 新增：我是幾號計算機 🟡 -->
        <div class="calculator-section">
            <div class="calc-title">📝 我是幾號？(自動算時間)</div>
            <div class="input-group">
                <span style="font-size:1.2rem;">我是</span>
                <!-- inputmode="numeric" 會讓手機跳出數字鍵盤 -->
                <input type="number" id="myNumber" placeholder="?" inputmode="numeric" oninput="calculateWait()">
                <span style="font-size:1.2rem;">號</span>
            </div>
            <div class="calc-result" id="calcResult">
                輸入您的號碼<br>幫您預估時間
            </div>
        </div>

        <div class="footer">
            每 20 秒自動更新診號
        </div>
    </div>

    <script>
        // =========================================================
        // ★★★ 請在下方引號內貼上你的 Web App 網址 ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbzuUZi7GI4v3b7zYXvtytod0LvYVwQF9lCMWnOTKPeDcbLB1X0Wao_KiFUIl-B6qGolwA/exec";
        // =========================================================

        // 預設每號等待時間 (分鐘)
        const MINUTES_PER_PERSON = 5;

        // 全域變數存目前的號碼
        let currentClinicNumber = 0;

        const el = {
            name: document.getElementById('clinicName'),
            status: document.getElementById('status'),
            number: document.getElementById('currentNumber'),
            waiting: document.getElementById('waitingCount'),
            update: document.getElementById('lastUpdate'),
            conn: document.getElementById('connStatus'),
            myInput: document.getElementById('myNumber'),
            calcRes: document.getElementById('calcResult')
        };

        async function updateData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(API_URL + "?t=" + timestamp);
                if (!response.ok) throw new Error("Network error");
                
                const data = await response.json();

                // 更新全域變數
                currentClinicNumber = parseInt(data.currentNumber);

                // 更新畫面
                el.name.innerText = data.clinicName;
                el.status.innerText = data.status;
                el.number.innerText = data.currentNumber;
                el.waiting.innerText = data.waitingCount + " 人";
                el.update.innerText = data.lastUpdate;

                // 視覺回饋
                if (parseInt(data.waitingCount) > 10) {
                    el.number.style.color = "#f5365c";
                } else {
                    el.number.style.color = "#32325d";
                }

                el.conn.className = "connection-status status-ok";

                // ★ 重點：每次診號更新，也要重新計算使用者的等待時間
                calculateWait();

            } catch (error) {
                console.error("更新失敗:", error);
                el.conn.className = "connection-status status-err";
            }
        }

        // ★ 新增：計算等待時間的功能
        function calculateWait() {
            // 取得使用者輸入的號碼
            const myNum = parseInt(el.myInput.value);

            // 如果沒輸入，或是目前的診號還沒抓到，就不算
            if (isNaN(myNum) || currentClinicNumber === 0) {
                el.calcRes.innerHTML = "輸入您的號碼<br>幫您預估時間";
                return;
            }

            // 計算差距
            const diff = myNum - currentClinicNumber;

            if (diff < 0) {
                el.calcRes.innerHTML = "您的號碼<span class='time-highlight'>已過號</span><br>請洽櫃台人員";
            } else if (diff === 0) {
                el.calcRes.innerHTML = "就是<span class='time-highlight'>現在</span>！<br>請準備看診";
            } else {
                const waitTime = diff * MINUTES_PER_PERSON;
                el.calcRes.innerHTML = `前面還有 ${diff} 人<br>預計等候 <span class='time-highlight'>${waitTime}</span> 分鐘`;
            }
        }

        // 啟動
        updateData();
        setInterval(updateData, 20000);

    </script>
</body>
</html>
